name: Enveloppe — Budget
version: "1.5.0"
slug: enveloppe
description: >-
  Suivi de budget en mode enveloppe : import de relevés bancaires,
  catégorisation automatique, contrats d'assurance avec documents et
  échéances, objectifs d'épargne.
url: https://github.com/MaximeLombSep/maxperso
arch:
  - aarch64
  - amd64
  - armv7
init: false

# L'interface est servie par l'ingress Home Assistant : aucun port n'est
# publié sur le réseau, et l'add-on hérite de l'authentification HA.
ingress: true
ingress_port: 8099
panel_icon: mdi:wallet-outline
panel_title: Budget
panel_admin: true

# Aucun port n'est ouvert par défaut. À ne renseigner que si vous voulez
# joindre l'application hors de Home Assistant (déconseillé sans TLS).
ports:
  8099/tcp: null
ports_description:
  8099/tcp: >-
    Accès direct hors ingress, par exemple depuis Tailscale. Publier ce port
    n'a de sens qu'avec l'option require_login activée et un mot de passe
    défini dans les Réglages de l'application.

# /data est persistant et inclus dans les sauvegardes Home Assistant.
options:
  currency: EUR
  max_upload_mb: 25
  allow_insecure_cookies: true
  require_login: false
schema:
  currency: str
  max_upload_mb: int(1,100)
  allow_insecure_cookies: bool
  require_login: bool
